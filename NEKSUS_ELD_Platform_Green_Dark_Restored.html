function seededUnit(seed){let x=Math.abs(seed)|0;x=(x^61)^(x>>>16);x=x+(x<<3);x=x^(x>>>4);x=Math.imul(x,0x27d4eb2d);x=x^(x>>>15);return (x>>>0)/4294967295;}
function daySeed(d,date){let h=(d.index+1)*92821;for(const c of date)h=(Math.imul(h,33)+c.charCodeAt(0))|0;return Math.abs(h);}
function cloneSeg(s){return JSON.parse(JSON.stringify(s));}
function segmentDefaults(d,date,seg,j,route,odo,eng){
 const status=seg.status,drive=status==='DR',loc=seg.location||route[Math.min(route.length-1,Math.floor((j/(Math.max(1,route.length+1)))*route.length))]?.name||city(d).name;
 return {...seg,location:loc,odoStart:Number.isFinite(seg.odoStart)?seg.odoStart:Math.round(odo),engineHours:Number.isFinite(seg.engineHours)?seg.engineHours:Number(eng.toFixed(1)),trailer:seg.trailer??d.trailer,bol:seg.bol??d.bol,coDriver:seg.coDriver??(d.index%13===0?driverById('D'+String(((d.index+7)%20)+1).padStart(4,'0'))?.name||'':''),source:seg.source||((drive)?'Automatic':'Driver'),edited:Boolean(seg.edited),editReason:seg.editReason||''};
}
function baseLogSegments(d,date){
 const ago=Math.round((new Date(TODAY+'T12:00Z')-new Date(date+'T12:00Z'))/86400000),end=date===TODAY?NOW_MIN:1440,i=d.index,seed=daySeed(d,date),r=n=>seededUnit(seed+n*7331);
 // A longer synthetic route gives long-haul driving blocks a different hourly location.
 const route=Array.from({length:22},(_,k)=>CITIES[(d.cityIndex+i*3+ago*5+k*(2+(i%5)))%CITIES.length]);
 let raw=[],cursor=0,routeIndex=0;
 const clampDur=v=>Math.max(5,Math.round(v));
 const addDur=(status,duration,note,special='')=>{
  if(cursor>=end)return;
  const start=cursor,stop=Math.min(end,cursor+clampDur(duration));
  if(stop<=start)return;
  const current=route[Math.min(routeIndex,route.length-1)]||city(d);
  let routeLocations=[current.name],endLocation=current.name;
  if(status==='DR'){
   const hourSteps=Math.max(1,Math.ceil((stop-start)/60));
   routeLocations=Array.from({length:hourSteps+1},(_,h)=>route[Math.min(route.length-1,routeIndex+h)]?.name||current.name);
   endLocation=routeLocations.at(-1)||current.name;
   routeIndex=Math.min(route.length-1,routeIndex+hourSteps);
  }
  raw.push({start,end:stop,status,note,special,location:current.name,endLocation,routeLocations});
  cursor=stop;
 };
 const fill=(status,note,special='')=>{if(cursor<end){const current=route[Math.min(routeIndex,route.length-1)]||city(d);raw.push({start:cursor,end,status,note,special,location:current.name,endLocation:current.name,routeLocations:[current.name]});cursor=end;}};
 if(d.created||!d.truck){fill('OFF','Off duty / unassigned');}
 else{
  const restDay=date!==TODAY&&((i*11+ago*7)%17===0);
  if(restDay){
   const split=420+Math.round(r(1)*280);addDur('OFF',split,'Off duty / home time');addDur('SB',240+Math.round(r(2)*220),'Sleeper berth');fill('OFF',(i+ago)%2?'34-hour restart / off duty':'Off duty / reset day');

    addDur('ON',12+Math.round(r(6)*16),'Fuel / vehicle check');
    addDur('OFF',30+Math.round(r(7)*10),'30-minute break');
    addDur('DR',210+Math.round(r(8)*75),'Linehaul driving');
    addDur('ON',15+Math.round(r(9)*18),'Post-trip inspection');
    fill('OFF','Off duty / end of shift');
   }else if(v===2){

  async loadFleet(){const payload=await this.request('/v1/fleet/live');for(const x of unwrapList(payload,'drivers').length?unwrapList(payload,'drivers'):unwrapList(payload,'vehicles'))normalizeLiveVehicle(x);liveFetchStamp.set('fleet',Date.now())},
  async loadHos(driverId){const payload=await this.request('/v1/drivers/'+encodeURIComponent(driverId)+'/hos');const h=normalizeHosPayload(payload,driverId);if(h)liveHos.set(driverId,h);liveFetchStamp.set('hos:'+driverId,Date.now())},
  async loadHosBulk(){try{const payload=await this.request('/v1/hos/current');const list=unwrapList(payload,'hos');if(!list.length)throw Object.assign(new Error('No bulk HOS payload'),{status:404});for(const x of list){const id=String(x.driver_id||x.driverId||x.id||'');const h=normalizeHosPayload(x,id);if(id&&h)liveHos.set(id,h)}}catch(e){if(e.status&&e.status!==404)throw e;const ids=db.drivers.map(d=>d.id);for(let i=0;i<ids.length;i+=8)await Promise.allSettled(ids.slice(i,i+8).map(id=>this.loadHos(id))) }liveFetchStamp.set('hos-bulk',Date.now())},
  async loadLog(driverId,date){const d=driverById(driverId);if(!d)return;const payload=await this.request('/v1/drivers/'+encodeURIComponent(driverId)+'/logs/'+encodeURIComponent(date));const n=normalizeLogPayload(payload,d);liveLogs.set(driverId+':'+date,n);if(n.hos)liveHos.set(driverId,n.hos);liveFetchStamp.set('log:'+driverId+':'+date,Date.now())},
  async refreshCore(){if(!this.isEnabled())return;this.setStatus(this.status==='live'?'live':'connecting');try{await this.loadDrivers();await Promise.allSettled([this.loadAlerts(),this.loadFleet(),this.loadHosBulk()]);this.setStatus(this.ws&&this.ws.readyState===1?'live':'degraded');render()}catch(e){this.setStatus('offline',e.message);console.warn('NEKSUS live REST unavailable:',e);render()}},
  async ensureVisibleData(){if(!this.isEnabled())return;const now=Date.now();if(state.page==='logs'&&state.driverId){const key='log:'+state.driverId+':'+state.date;if(now-(liveFetchStamp.get(key)||0)>15000){try{await Promise.all([this.loadLog(state.driverId,state.date),this.loadHos(state.driverId)]);if(state.page==='logs')render()}catch(e){this.lastError=e.message}}this.subscribeDriver(state.driverId)}},
  wsTarget(){let u=String(this.config.wsUrl||'').trim();if(!u){const b=cleanBase(this.config.apiBase);u=b.replace(/^http/i,'ws')+'/v1/ws'}return u},
  connectWS(){if(!this.isEnabled())return;clearTimeout(this.retryTimer);let url=this.wsTarget();if(!url)return;try{this.setStatus('connecting');this.ws=new WebSocket(url)}catch(e){this.scheduleReconnect(e);return}const ws=this.ws;ws.addEventListener('open',()=>{this.retryMs=1000;this.setStatus('live');if(this.config.token)ws.send(JSON.stringify({type:'authenticate',token:this.config.token}));ws.send(JSON.stringify({type:'subscribe',topics:['drivers','hos','alerts','fleet.live']}));if(state.driverId)this.subscribeDriver(state.driverId)});ws.addEventListener('message',ev=>{let msg;try{msg=JSON.parse(ev.data)}catch(e){return}this.handleWS(msg)});ws.addEventListener('close',()=>this.scheduleReconnect('WebSocket closed'));ws.addEventListener('error',()=>{this.lastError='WebSocket error'})},
  scheduleReconnect(reason){if(!this.isEnabled())return;this.setStatus('degraded',reason);clearTimeout(this.retryTimer);const wait=this.retryMs;this.retryMs=Math.min(this.retryMs*2,30000);this.retryTimer=setTimeout(()=>this.connectWS(),wait)},
  subscribeDriver(id){if(this.ws?.readyState===1&&id)this.ws.send(JSON.stringify({type:'subscribe',topics:['driver:'+id]}))},
  handleWS(msg){const type=String(msg.type||msg.event||''),data=msg.data||msg.payload||msg;if(type==='ping'){this.ws?.send(JSON.stringify({type:'pong',ts:Date.now()}));return}if(type==='driver.hos.updated'){const id=String(msg.driver_id||data.driver_id||data.driverId||'');const h=normalizeHosPayload(data,id);if(id&&h){const prev=liveHos.get(id);if(!prev||!h.revision||h.revision>=prev.revision)liveHos.set(id,h)}}else if(['driver.status.changed','driver.location.updated','driver.connection.changed','fleet.driver.updated'].includes(type)){normalizeLiveVehicle({...data,driver_id:msg.driver_id||data.driver_id})}else if(type==='fleet.map.updated'){for(const x of unwrapList(data,'drivers'))normalizeLiveVehicle(x)}else if(['driver.log.updated','driver.intermediate.created'].includes(type)){const id=String(msg.driver_id||data.driver_id||'');for(const k of [...liveLogs.keys()])if(k.startsWith(id+':'))liveLogs.delete(k);liveFetchStamp.delete('log:'+id+':'+state.date);if(id===state.driverId)this.ensureVisibleData()}else if(['driver.violation.created','driver.violation.resolved','alerts.updated','alert.created','alert.updated','alert.resolved'].includes(type)){this.loadAlerts().then(()=>render()).catch(()=>{})}else if(type==='driver.updated'){this.loadDrivers().then(()=>render()).catch(()=>{})}render()},
  startPolling(){clearInterval(this.pollTimer);this.pollTimer=setInterval(()=>{if(!this.isEnabled())return;const wsHealthy=this.ws?.readyState===1;if(!wsHealthy)this.refreshCore();else Promise.allSettled([this.loadAlerts(),this.loadFleet()]).then(()=>render());this.ensureVisibleData()},Math.max(10,Number(this.config.pollSeconds)||30)*1000);clearInterval(this.clockTimer);this.clockTimer=setInterval(()=>{if(this.isEnabled()&&state.page==='logs')render()},30000)},
  async start(){if(!this.isEnabled()){this.status='idle';render();return}await this.refreshCore();this.connectWS();this.startPolling();this.ensureVisibleData()},
  saveConfig(cfg){this.config={...this.config,...cfg,apiBase:cleanBase(cfg.apiBase)};const stored={...this.config,token:''};localStorage.setItem(LIVE_CONFIG_KEY,JSON.stringify(stored));try{sessionStorage.setItem(LIVE_CONFIG_KEY+':token',this.config.token||'')}catch(e){}}
};
window.NEKSUS_LIVE_API=LiveAPI;

// Prefer server HOS/log/alert projections when live data is available; keep the built-in demo as an offline fallback.
const _localHos=hos,_localLogSegments=logSegments,_localEventRows=eventRows,_localAllAlerts=allAlerts,_baseRender=render;
hos=function(d,date=TODAY){const h=liveHos.get(d?.id);if(!h||date!==TODAY)return _localHos(d,date);const elapsed=Math.max(0,(Date.now()-h.asOfMs)/60000),s=statusCode(d?.status||h.currentStatus);let out={...h,raw:{...h.raw},used:{...h.used}};if(s==='DR'){out.break=Math.max(0,out.break-elapsed);out.drive=Math.max(0,out.drive-elapsed);out.cycle=Math.max(0,out.cycle-elapsed)}else if(s==='ON')out.cycle=Math.max(0,out.cycle-elapsed);if(out.shiftStart)out.shift=Math.max(0,out.shift-elapsed);out.raw={break:out.break,drive:out.drive,shift:out.shift,cycle:out.cycle};return out};
logSegments=function(d,date){const live=liveLogs.get(d?.id+':'+date);if(!live)return _localLogSegments(d,date);return live.segments.map(s=>s.open?{...s,end:Math.min(1440,Math.max(s.start,liveNowMinute(live.timezone||driverTz(d))))}:{...s})};
eventRows=function(d,date){const live=liveLogs.get(d?.id+':'+date);if(!live)return _localEventRows(d,date);if(live.events?.length)return live.events;const out=[];for(let i=0;i<live.segments.length;i++){const seg=live.segments[i];out.push({id:seg.id||`live-seg-${i}`,minute:seg.start,status:seg.status,type:seg.special||'Duty status',note:seg.note||'',odo:0,engineHours:0,duration:Math.max(0,seg.end-seg.start),source:'ELD',flag:false,location:d.liveLocation||city(d).name,edited:Boolean(seg.edited)});if(seg.status==='DR'){for(let t=seg.start+60;t<seg.end;t+=60)out.push({id:`${seg.id||'live-seg-'+i}-I${t}`,minute:t,status:'INTERMEDIATE',type:'Intermediate',note:'Projected hourly intermediate from live driving segment',odo:0,engineHours:0,duration:null,source:'Projected',flag:false,location:d.liveLocation||city(d).name,edited:false});}}return out.sort((a,b)=>a.minute-b.minute||String(a.id).localeCompare(String(b.id)))};
allAlerts=function(){return Array.isArray(liveAlerts)?liveAlerts:_localAllAlerts()};
render=function(){_baseRender();queueMicrotask(()=>LiveAPI.ensureVisibleData())};

function showLiveApiConfig(){const c=LiveAPI.config;showModal('Live backend connection',`<form data-form="live-api" class="live-api-form"><p class="modal-sub">Connect this Netlify frontend to the NEKSUS REST API and WebSocket gateway. The built-in demo remains available if the backend is unreachable.</p><div class="form-body"><label class="custom-accent-toggle"><input type="checkbox" name="enabled" ${c.enabled?'checked':''}> Enable live backend</label><div class="form-group"><label>REST API base URL</label><input name="apiBase" type="url" placeholder="https://api.example.com" value="${esc(c.apiBase)}"><small>The frontend calls <code>/v1/drivers</code>, <code>/v1/alerts</code>, <code>/v1/fleet/live</code>, HOS, and driver log endpoints.</small></div><div class="form-group"><label>WebSocket URL</label><input name="wsUrl" type="url" placeholder="wss://api.example.com/v1/ws" value="${esc(c.wsUrl)}"><small>Leave blank to derive <code>/v1/ws</code> from the REST API host.</small></div><div class="form-group"><label>Bearer token (optional)</label><input class="api-secret" name="token" type="password" autocomplete="off" value="${esc(c.token)}" placeholder="JWT or API access token"><small>Stored only for this browser tab. For production, prefer secure same-site authentication or a short-lived token.</small></div><div class="form-grid"><div class="form-group"><label>REST fallback poll</label><input name="pollSeconds" type="number" min="10" max="300" step="5" value="${Number(c.pollSeconds)||30}"><small>Seconds between fallback refreshes.</small></div></div><div class="api-help"><strong>Expected REST:</strong> <code>GET /v1/drivers</code>, <code>GET /v1/hos/current</code> (optional bulk), <code>GET /v1/drivers/:id/hos</code>, <code>GET /v1/alerts?status=open</code>, <code>GET /v1/fleet/live</code>, <code>GET /v1/drivers/:id/logs/:date</code>.<br><strong>WebSocket events:</strong> <code>driver.status.changed</code>, <code>driver.hos.updated</code>, <code>driver.location.updated</code>, <code>driver.connection.changed</code>, <code>driver.log.updated</code>, <code>driver.violation.created/resolved</code>, and <code>fleet.driver.updated</code>.</div><div class="live-api-state"><strong>Current state: ${esc(LiveAPI.status)}</strong><small>${esc(LiveAPI.lastError||'No recent backend error.')}</small></div></div><div class="modal-footer"><button class="btn" type="button" data-action="close-dialog">Cancel</button><button class="btn primary" type="submit">${icon('wifi')} Save & reconnect</button></div></form>`, '', true)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="live-api-config"]');if(!b)return;e.preventDefault();showLiveApiConfig()});
document.addEventListener('submit',e=>{const form=e.target;if(form.dataset.form!=='live-api')return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form);const apiBase=String(fd.get('apiBase')||'').trim(),wsUrl=String(fd.get('wsUrl')||'').trim(),token=String(fd.get('token')||''),enabled=fd.get('enabled')==='on',pollSeconds=Math.max(10,Math.min(300,Number(fd.get('pollSeconds'))||30));if(enabled&&!/^https?:\/\//i.test(apiBase)&&!apiBase.startsWith('/')){toast('Enter a valid REST API URL.',true);return}if(wsUrl&&!/^wss?:\/\//i.test(wsUrl)){toast('WebSocket URL must start with ws:// or wss://.',true);return}LiveAPI.saveConfig({enabled,apiBase,wsUrl,token,pollSeconds});closeDialog();toast('Live backend settings saved. Reconnecting…');setTimeout(()=>location.reload(),350)});

function prepareOriginalSources(){for(const d of db.drivers)if(!d.logSource)d.logSource={truck:d.truck,status:d.status,boxTruck:d.boxTruck};}
prepareOriginalSources();persist();window.addEventListener('hashchange',readRoute);window.addEventListener('popstate',readRoute);readRoute();LiveAPI.start();
</script>
